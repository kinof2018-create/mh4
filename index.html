<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A1758" />
<title>삼화당피앤티 사내 안내문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary-300:#4D67C3; --color-primary-400:#2645B0; --color-primary-500:#1428A0;
  --color-primary-600:#0F1E78; --color-primary-700:#0A1758;
  --secondary-500:#2AA39B;
  --notice:#1428A0; --notice-d:#0F1E78; --edu:#2E9E5B; --edu-d:#1F7A44; --bus:#E8710A; --bus-d:#B8560A;
  --bg-base:#F4F5F8; --bg-subtle:#EEF0F5; --bg-elevated:#FFFFFF;
  --text-primary:#0A0A0F; --text-secondary:#2A2E3A; --text-tertiary:#5A5F6E;
  --border-default:#E1E4EC; --border-subtle:#EDEFF4; --border-strong:#C4C9D6;
  --sidebar-bg:#0A1758; --sidebar-fg:rgba(255,255,255,0.86); --sidebar-fg-dim:rgba(255,255,255,0.6);
  --radius-md:8px; --radius-lg:12px; --radius-xl:18px; --radius-full:9999px;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.06); --shadow-md:0 6px 18px rgba(16,24,40,0.08); --shadow-card:0 14px 28px rgba(20,40,160,0.16);
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --board-max:520px;
}
body.dark{
  --bg-base:#12121A; --bg-subtle:#0B0B12; --bg-elevated:#22222D;
  --text-primary:#FFFFFF; --text-secondary:rgba(255,255,255,0.84); --text-tertiary:rgba(255,255,255,0.66);
  --border-default:rgba(255,255,255,0.12); --border-subtle:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.24);
  --sidebar-bg:#080E24; --sidebar-fg:rgba(255,255,255,0.86); --sidebar-fg-dim:rgba(255,255,255,0.55);
  --shadow-md:0 8px 20px rgba(0,0,0,0.40); --shadow-card:0 14px 28px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{background:var(--bg-subtle);-webkit-text-size-adjust:100%;}
body{font-family:var(--font);background:var(--bg-subtle);color:var(--text-primary);-webkit-font-smoothing:antialiased;line-height:1.5;}

/* ===== 세로형 안내판(엘리베이터 사이니지) 프레임 : 모바일/태블릿 최적화 ===== */
.app{
  max-width:var(--board-max);
  margin:0 auto;
  min-height:100vh;
  background:var(--bg-base);
  display:flex;
  flex-direction:column;
  box-shadow:0 0 44px rgba(16,24,40,0.14);
  position:relative;
  overflow-x:hidden;
}

/* --- 상단 브랜드 헤더 --- */
.board-head{
  color:#fff;
  background:linear-gradient(135deg,var(--color-primary-700),var(--color-primary-500) 55%,#2645B0 120%);
  padding:calc(16px + env(safe-area-inset-top)) 16px 15px;
  display:flex;align-items:center;gap:12px;
}
.board-head .mk{
  width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:22px;
  background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.26);
}
.board-head .tt{flex:1;min-width:0;}
.board-head .tt b{display:block;font-size:1.12rem;font-weight:800;letter-spacing:-0.01em;line-height:1.2;}
.board-head .tt span{display:block;font-size:0.66rem;font-weight:600;color:rgba(255,255,255,0.72);margin-top:2px;letter-spacing:0.04em;}
.theme-btn{
  cursor:pointer;border:1px solid rgba(255,255,255,0.28);background:rgba(255,255,255,0.12);color:#fff;
  border-radius:var(--radius-full);padding:8px 12px;font:700 0.7rem/1 var(--font);flex:none;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.theme-btn:active{transform:scale(0.96);}
.theme-btn #themeLabel{display:none;}

/* --- 부제 + 실시간 날짜 + 인쇄 --- */
.board-sub{
  background:linear-gradient(135deg,var(--color-primary-500),#2645B0 130%);
  color:#fff;padding:0 16px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.board-sub #topSub{margin:0;font-size:0.76rem;font-weight:600;color:rgba(255,255,255,0.78);flex:1;min-width:140px;line-height:1.5;}
.chip{
  font-size:0.72rem;font-weight:800;padding:7px 12px;border-radius:var(--radius-full);
  background:rgba(255,255,255,0.16);color:#fff;border:1px solid rgba(255,255,255,0.22);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,0.28);}
.print-btn{
  cursor:pointer;border:0;border-radius:var(--radius-full);padding:9px 15px;font:800 0.72rem/1 var(--font);
  background:linear-gradient(120deg,var(--bus),#F59E0B);color:#fff;box-shadow:var(--shadow-sm);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.print-btn:active{transform:scale(0.97);}

/* --- 섹션 탭바 (스크롤해도 상단 고정) --- */
.tabbar{
  position:sticky;top:0;z-index:30;
  background:var(--bg-elevated);
  border-bottom:1px solid var(--border-default);
  box-shadow:0 2px 10px rgba(16,24,40,0.06);
  padding:6px;
}
.sb-nav{list-style:none;margin:0;padding:0;display:flex;gap:6px;}
.sb-item{
  flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:9px 6px;border-radius:12px;cursor:pointer;
  font-size:0.76rem;font-weight:700;color:var(--text-tertiary);
  background:var(--bg-subtle);border:1px solid transparent;
  transition:background .15s,color .15s,box-shadow .15s;
  position:relative;text-align:center;
}
.sb-item .ic{font-size:18px;line-height:1;}
.sb-item > span:not(.ic):not(.pill){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.sb-item:active{transform:scale(0.98);}
.sb-item.active{
  background:linear-gradient(135deg,var(--color-primary-500),#2645B0);
  color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(20,40,160,0.28);border-color:transparent;
}
.sb-item .pill{
  position:absolute;top:5px;right:8px;
  font-size:9px;font-weight:800;min-width:16px;height:16px;padding:0 4px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;color:#fff;line-height:1;
}

/* --- 콘텐츠 (세로 스크롤) --- */
.content{padding:16px 14px 30px;flex:1;}

/* --- 하단 안내 푸터 --- */
.board-foot{
  padding:18px 16px calc(22px + env(safe-area-inset-bottom));
  background:var(--sidebar-bg);color:var(--sidebar-fg-dim);
  font-size:0.72rem;font-weight:600;line-height:1.8;text-align:center;
}
.board-foot b{color:#fff;font-weight:800;}

/* ===== 섹션 히어로(카테고리 헤더) ===== */
.cat-head{
  display:flex;align-items:center;gap:13px;padding:18px 18px;margin-bottom:18px;
  border-radius:var(--radius-xl);box-shadow:var(--shadow-card);color:#fff;
  background:linear-gradient(135deg,var(--notice-d),var(--notice) 75%,var(--secondary-500) 160%);
}
.cat-head.tone-edu{background:linear-gradient(135deg,var(--edu-d),var(--edu) 95%);}
.cat-head.tone-bus{background:linear-gradient(135deg,var(--bus-d),var(--bus) 95%);}
.cat-head .big{width:50px;height:50px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.28);}
.cat-head > div:not(.big):not(.hscore){flex:1;min-width:0;}
.cat-head h2{margin:0;font-size:1.24rem;font-weight:900;letter-spacing:-0.01em;}
.cat-head p{margin:5px 0 0;font-size:0.76rem;font-weight:600;color:rgba(255,255,255,0.9);line-height:1.45;}
.cat-head .hscore{margin-left:auto;text-align:right;flex:none;}
.cat-head .hscore b{font-size:1.7rem;font-weight:900;line-height:1;display:block;}
.cat-head .hscore span{display:block;font-size:0.66rem;font-weight:700;color:rgba(255,255,255,0.9);margin-top:5px;}

/* ===== 섹션 라벨 ===== */
.section-label{font-size:0.92rem;font-weight:900;margin:26px 2px 13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;letter-spacing:-0.01em;}
.section-label .bar{width:5px;height:18px;border-radius:3px;background:var(--color-primary-500);flex:none;}
.section-label .sub{font-weight:600;color:var(--text-tertiary);font-size:0.74rem;}

/* ===== KPI ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
.kpi{background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:15px 15px 14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;}
.kpi .kl{font-size:0.72rem;font-weight:700;color:var(--text-tertiary);display:flex;align-items:center;gap:6px;}
.kpi .kv{margin-top:9px;font-size:1.75rem;font-weight:900;letter-spacing:-0.02em;line-height:1;}
.kpi .kv small{font-size:0.8rem;font-weight:800;color:var(--text-tertiary);margin-left:3px;}
.kpi .ks{margin-top:8px;font-size:0.68rem;font-weight:700;color:var(--text-tertiary);line-height:1.45;}

/* ===== 카드(차트 등) : 세로 1열 ===== */
.card-grid{display:grid;grid-template-columns:1fr;gap:14px;}
.card{background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:17px 17px;box-shadow:var(--shadow-md);}
.card h3{margin:0 0 3px;font-size:0.98rem;font-weight:800;}
.card .cdesc{margin:0 0 12px;font-size:0.72rem;font-weight:600;color:var(--text-tertiary);}
.chart-box{position:relative;height:240px;}
.chart-fallback{display:none;padding:20px;text-align:center;font-size:0.78rem;color:var(--text-tertiary);background:var(--bg-subtle);border:1px dashed var(--border-default);border-radius:var(--radius-md);}
/* 인라인 2열 그리드(셔틀버스 연락처+요약)를 세로 안내판에서 1열로 정렬 */
.card-grid[style]{grid-template-columns:1fr !important;}

/* ===== 공지 카드 ===== */
.notice-list{display:flex;flex-direction:column;gap:11px;}
.ntc{background:var(--bg-elevated);border:1px solid var(--border-default);border-left:5px solid var(--color-primary-500);border-radius:var(--radius-lg);padding:15px 16px;box-shadow:var(--shadow-sm);}
.ntc.pin{border-left-color:#D64545;background:linear-gradient(90deg,rgba(214,69,69,0.06),var(--bg-elevated) 45%);}
.ntc .nh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ntc .ncat{font-size:0.66rem;font-weight:800;padding:3px 9px;border-radius:9999px;color:#fff;}
.ntc .ntitle{font-size:1rem;font-weight:800;color:var(--text-primary);width:100%;line-height:1.4;order:3;margin-top:2px;}
.ntc .npin{font-size:0.62rem;font-weight:800;color:#D64545;background:#FDE7EC;padding:3px 8px;border-radius:9999px;}
.ntc .ndate{margin-left:auto;font-size:0.7rem;font-weight:700;color:var(--text-tertiary);}
.ntc .nbody{margin-top:10px;font-size:0.9rem;font-weight:500;color:var(--text-secondary);line-height:1.72;}
.cat-안전{background:#D64545;} .cat-총무{background:#1B63D6;} .cat-교육{background:#2E9E5B;} .cat-인사{background:#8A5AD6;} .cat-일반{background:#5A5F6E;}
/* 공지 카테고리 필터(칩) */
.ntc-filter{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
.nf-chip{display:inline-flex;align-items:center;gap:6px;font-size:0.78rem;font-weight:700;padding:8px 13px;border-radius:9999px;border:1px solid var(--border-default);background:var(--bg-elevated);color:var(--text-secondary);cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;box-shadow:var(--shadow-sm);}
.nf-chip:active{transform:scale(0.97);}
.nf-chip.active{background:var(--color-primary-500);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(20,40,160,0.28);}
.nf-chip .nf-n{font-size:0.66rem;font-weight:800;background:var(--bg-subtle);color:var(--text-tertiary);padding:1px 7px;border-radius:9999px;}
.nf-chip.active .nf-n{background:rgba(255,255,255,0.24);color:#fff;}
.nf-chip .nf-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.ntc.hide{display:none;}
.ntc-empty{padding:22px 14px;text-align:center;font-size:0.8rem;font-weight:600;color:var(--text-tertiary);background:var(--bg-subtle);border:1px dashed var(--border-default);border-radius:var(--radius-md);}
/* 공지 카드: 클릭(탭) → 상세 팝업 */
.ntc{cursor:pointer;transition:transform .12s,box-shadow .12s;}
.ntc:active{transform:scale(0.994);}
.ntc .nmore{margin-top:10px;font-size:0.7rem;font-weight:700;color:var(--text-tertiary);display:flex;justify-content:flex-end;}
/* 최근 1건: LED 음영 강조 */
.ntc.led{border-left-color:#D64545;background:linear-gradient(90deg,rgba(214,69,69,0.12),var(--bg-elevated) 55%);animation:ledPulse 1.6s ease-in-out infinite;}
@keyframes ledPulse{0%,100%{box-shadow:0 0 0 1px rgba(214,69,69,0.30),0 0 10px rgba(214,69,69,0.16);}50%{box-shadow:0 0 0 1px rgba(214,69,69,0.60),0 0 22px rgba(214,69,69,0.42);}}
.nled{display:inline-flex;align-items:center;gap:5px;font-size:0.62rem;font-weight:800;color:#fff;background:#D64545;padding:3px 9px;border-radius:9999px;box-shadow:0 0 8px rgba(214,69,69,0.65);}
.nled .led-dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:ledBlink 1s steps(1,end) infinite;}
@keyframes ledBlink{0%,49%{opacity:1;}50%,100%{opacity:0.3;}}
/* 공지 상세 팝업(모달 · 바텀시트) */
.ntc-modal{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;justify-content:center;}
.ntc-modal.show{display:flex;}
.ntc-modal-dim{position:absolute;inset:0;background:rgba(8,12,30,0.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
.ntc-modal-card{position:relative;width:100%;max-width:var(--board-max);background:var(--bg-elevated);color:var(--text-primary);border-radius:22px 22px 0 0;padding:24px 20px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -14px 44px rgba(0,0,0,0.38);max-height:82vh;overflow-y:auto;animation:sheetUp .22s ease;}
@keyframes sheetUp{from{transform:translateY(34px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
.ntc-modal-x{position:absolute;top:13px;right:13px;width:34px;height:34px;border:0;border-radius:50%;background:var(--bg-subtle);color:var(--text-secondary);font-size:14px;font-weight:800;cursor:pointer;display:grid;place-items:center;}
.ntc-modal-x:active{transform:scale(0.94);}
.nm-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px;padding-right:38px;}
.nm-top .nm-date{margin-left:auto;font-size:0.72rem;font-weight:700;color:var(--text-tertiary);}
.nm-title{margin:0 0 14px;font-size:1.14rem;font-weight:900;line-height:1.42;letter-spacing:-0.01em;}
.nm-body{font-size:0.94rem;font-weight:500;color:var(--text-secondary);line-height:1.85;white-space:pre-line;}
.nled-tag{display:inline-flex;align-items:center;gap:5px;font-size:0.62rem;font-weight:800;color:#fff;background:#D64545;padding:3px 9px;border-radius:9999px;box-shadow:0 0 8px rgba(214,69,69,0.6);}
.nled-tag .led-dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:ledBlink 1s steps(1,end) infinite;}

/* ===== 안전교육 세부 카드 + 파일 ===== */
.sub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
.sub-card{background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:15px 15px;cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .12s,border-color .12s;}
.sub-card:active{transform:scale(0.99);}
.sub-card.active{border-color:var(--edu);box-shadow:var(--shadow-card);}
.sub-card .nm{font-size:0.9rem;font-weight:700;display:flex;align-items:center;gap:8px;line-height:1.35;}
.sub-card .nm .num{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:0.68rem;font-weight:800;background:var(--bg-subtle);color:var(--edu);}
.sub-card .meta{margin-top:8px;font-size:0.7rem;font-weight:600;color:var(--text-tertiary);}
.files-panel{margin-top:14px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:17px 16px;box-shadow:var(--shadow-md);}
.fp-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap;}
.fp-head h3{margin:0;font-size:0.95rem;font-weight:800;}
.fp-head .tag{font-size:0.66rem;font-weight:700;padding:3px 9px;border-radius:9999px;background:var(--bg-subtle);color:var(--text-tertiary);}
.fp-desc{font-size:0.75rem;color:var(--text-tertiary);font-weight:500;margin:0 0 14px;line-height:1.6;}
.file-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
.file-card{border:1.5px dashed var(--border-strong);border-radius:var(--radius-md);padding:16px 12px;text-align:center;color:var(--text-tertiary);background:var(--bg-subtle);}
.file-card .fi{font-size:26px;opacity:.55;} .file-card .fn{margin-top:8px;font-size:0.74rem;font-weight:700;color:var(--text-secondary);} .file-card .fs{margin-top:3px;font-size:0.66rem;font-weight:600;}
.file-card.doc{border-style:solid;border-color:var(--border-default);background:var(--bg-elevated);cursor:pointer;text-decoration:none;transition:box-shadow .12s,border-color .12s;display:block;}
.file-card.doc:active{transform:scale(0.99);}
.file-card.doc .fi{opacity:1;color:var(--edu);} .file-card.doc .fn{color:var(--text-primary);word-break:break-all;}
.upload-btn{margin-left:auto;font-size:0.7rem;font-weight:700;text-decoration:none;padding:8px 13px;border-radius:9999px;background:var(--edu);color:#fff;white-space:nowrap;}
.upload-btn:active{transform:scale(0.97);}
.empty-note{margin-top:12px;font-size:0.72rem;color:var(--text-tertiary);background:var(--bg-subtle);border:1px dashed var(--border-default);border-radius:var(--radius-md);padding:11px 13px;line-height:1.7;}
.empty-note b{color:var(--edu);}

/* ===== 교육 영상 : 세로(플레이어 위, 목록 아래) ===== */
.vid-wrap{margin:0 0 4px;border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
.vid-head{display:flex;align-items:center;gap:10px;padding:12px 15px;font-size:0.9rem;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--edu-d),var(--edu) 90%);}
.vid-head .vid-cnt{background:rgba(255,255,255,0.22);border-radius:9999px;padding:2px 9px;font-size:0.68rem;margin-left:auto;}
.vid-body{display:grid;grid-template-columns:1fr;background:var(--bg-elevated);}
.vid-player{position:relative;background:#000;aspect-ratio:16/9;width:100%;}
.vid-player iframe,.vid-player video{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vid-list{list-style:none;margin:0;padding:8px;overflow-y:auto;max-height:230px;border-top:1px solid var(--border-default);}
.vid-item{display:flex;align-items:center;gap:9px;padding:11px 11px;border-radius:9px;cursor:pointer;font-size:0.82rem;font-weight:600;color:var(--text-secondary);margin-bottom:2px;}
.vid-item:active{transform:scale(0.99);} .vid-item.active{background:var(--edu);color:#fff;}
.vid-item .vt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vid-item .vk{font-size:0.58rem;font-weight:800;padding:2px 7px;border-radius:9999px;background:var(--bg-subtle);color:var(--text-tertiary);}
.vid-item.active .vk{background:rgba(255,255,255,0.24);color:#fff;}

/* ===== 셔틀버스 ===== */
.bus-photo{width:100%;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--border-default);display:block;}
.contact-card{background:linear-gradient(120deg,var(--bus-d),var(--bus) 90%);color:#fff;border-radius:var(--radius-lg);padding:17px 18px;box-shadow:var(--shadow-card);display:flex;align-items:center;gap:15px;}
.contact-card .ic{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,0.18);display:grid;place-items:center;font-size:25px;flex:none;}
.contact-card .lb{font-size:0.76rem;font-weight:700;color:rgba(255,255,255,0.9);}
.contact-card .num{font-size:1.75rem;font-weight:900;letter-spacing:0.01em;line-height:1.1;}
.contact-card a{color:#fff;text-decoration:none;}
/* 셔틀버스 연락처+요약 KPI(인라인 3열)를 세로 안내판 폭에 맞게 유지 */
.card-grid > .contact-card{margin-bottom:12px;}
.kpi-grid[style]{grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:9px !important;}
.kpi-grid[style] .kpi{padding:13px 11px;}
.kpi-grid[style] .kv{font-size:1.4rem;}
.route-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.route{background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;}
.route .rh{display:flex;align-items:center;gap:9px;padding:12px 15px;font-weight:800;font-size:0.92rem;color:#fff;}
.route.up .rh{background:linear-gradient(120deg,#155F9E,#2478C8);} .route.down .rh{background:linear-gradient(120deg,#B8560A,#E8710A);}
.route .rh .plate{margin-left:auto;font-size:0.66rem;font-weight:700;background:rgba(255,255,255,0.22);padding:3px 9px;border-radius:9999px;}
.route table{width:100%;border-collapse:collapse;font-size:0.84rem;}
.route th,.route td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border-subtle);}
.route thead th{background:var(--bg-subtle);color:var(--text-secondary);font-weight:800;font-size:0.72rem;}
.route td.stop{text-align:left;font-weight:700;color:var(--text-primary);}
.route tbody tr:active{background:var(--bg-subtle);}
.route td.t{font-variant-numeric:tabular-nums;font-weight:700;}

/* ===== 더 넓은 화면(태블릿 가로/데스크톱)에서도 세로 안내판 폭 유지 ===== */
@media (min-width:560px){
  .content{padding:20px 18px 34px;}
}
</style>

const GH_OWNER='kinof2018-create', GH_REPO='mh4', GH_BRANCH='main', SAFE_BASE='';

let SAFE_INDEX=null, VID_INDEX=null;
function normTxt(s){ return String(s==null?'':s).replace(/\s+/g,'').toLowerCase(); }
function skey(cat,sub){ return normTxt(cat)+'|'+normTxt(sub); }
function isVidList(f){ return /\.(txt|md)$/i.test(f) && /(영상|video|youtube|유튜브|재생목록|playlist)/i.test(f); }
function ytId(u){ var m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/))([\w-]{6,})/); return m?m[1]:''; }
function fileMeta(file){ const m=file.match(/(\d{4}-\d{2}-\d{2})/); const date=m?m[1]:''; let t=file.replace(/\.[^.]+$/,''); if(m)t=t.replace(m[1],'').replace(/^[_\-\s]+/,'').trim()||file; return {date,title:t}; }
function eduPath(sub){ return (SAFE_BASE?SAFE_BASE+'/':'')+EDU_CAT+'/'+sub; }
function addUploadHref(sub){ return 'https://github.com/'+GH_OWNER+'/'+GH_REPO+'/upload/'+GH_BRANCH+'/'+encodeURI(eduPath(sub)); }
async function fetchText(path){ var enc=path.split('/').map(encodeURIComponent).join('/');
  try{ var r=await fetch('https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/'+enc); if(r.ok) return await r.text(); }catch(e){}
  try{ var a=await fetch('https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+enc+'?ref='+GH_BRANCH,{headers:{'Accept':'application/vnd.github.raw'}}); if(a.ok) return await a.text(); }catch(e){}
  return ''; }
async function loadSafeIndex(){
  const api='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/git/trees/'+GH_BRANCH+'?recursive=1'; const idx={}, vidx={};
  try{ const res=await fetch(api,{headers:{'Accept':'application/vnd.github+json'}}); if(!res.ok) throw 0;
    const data=await res.json();
    (data.tree||[]).forEach(function(n){ if(n.type!=='blob')return; const p=n.path||''; const parts=p.split('/');
      const ci = SAFE_BASE ? 1 : 0;                       // EDU_CAT 폴더가 있는 위치
      if(SAFE_BASE && (parts[0]||'').toUpperCase()!==SAFE_BASE.toUpperCase()) return;
      if(parts.length < ci+3) return;                     // (base)/EDU_CAT/세부항목/파일
      if(normTxt(parts[ci])!==normTxt(EDU_CAT)) return;   // 안전보건교육 카테고리만
      const sub=parts[ci+1]; const file=parts[parts.length-1]; const key=skey(EDU_CAT,sub);
      if(isVidList(file)){ (vidx[key]=vidx[key]||[]).push({path:p,file:file}); return; }
      if(!/\.(pdf|png|jpe?g|gif|webp|hwp|hwpx|docx?|xlsx?|pptx?|tiff?)$/i.test(file)) return;
      (idx[key]=idx[key]||[]).push({path:p,file:file});
    });
    SAFE_INDEX=idx; VID_INDEX=vidx;
  }catch(e){ SAFE_INDEX={}; VID_INDEX={}; }
  if(activeKey==='edu') renderMain();
}

/* ===== 공지글 파일(공지목록.txt) 자동 연동 =====
   페이지가 열릴 때 저장소의 NOTICE_FILE을 읽어 공지 목록을 자동 구성합니다.
   파일이 없으면 아래 기본 NOTICES(예시)가 그대로 표시됩니다. */
function normalizeCat(c){ const v=String(c||'').replace(/\s+/g,''); const ok=['안전','총무','교육','인사','일반']; return ok.indexOf(v)>=0?v:'일반'; }
function parseNoticeFile(txt){
  const lines=String(txt).replace(/\r/g,'').split('\n');
  const out=[]; let cur=null, bodyMode=false;
  const flush=function(){ if(cur && (cur.title||cur.body)){ cur.title=cur.title||'(제목 없음)'; cur.cat=normalizeCat(cur.cat); cur.body=(cur.body||'').trim(); out.push(cur); } };
  for(let i=0;i<lines.length;i++){
    const raw=lines[i];
    if(/^\s*={2,}\s*$/.test(raw)){ flush(); cur={cat:'',date:'',pin:false,title:'',body:''}; bodyMode=false; continue; }
    if(!cur) continue;                 // 첫 === 이전의 안내문/주석은 무시
    if(/^\s*#/.test(raw)) continue;    // # 로 시작하는 줄은 메모
    const m = !bodyMode ? raw.match(/^\s*([^:：]+)\s*[:：]\s*(.*)$/) : null;
    if(m){
      const k=m[1].trim(), v=m[2].trim();
      if(/^(카테고리|분류|category)$/i.test(k)) cur.cat=v;
      else if(/^(날짜|일자|date)$/i.test(k)) cur.date=v;
      else if(/^(긴급|중요|고정|pin)$/i.test(k)) cur.pin=/^(예|y|yes|true|긴급|o|ㅇ|1)$/i.test(v);
      else if(/^(제목|title)$/i.test(k)) cur.title=v;
      else if(/^(내용|본문|content|body)$/i.test(k)){ cur.body=v; bodyMode=true; }
      else if(cur.title){ cur.body+=(cur.body?'\n':'')+raw.trim(); }  // 알 수 없는 줄 → 본문 취급
    } else if(bodyMode){
      cur.body+=(cur.body?'\n':'')+raw;
    } else if(cur.title){
      cur.body+=(cur.body?'\n':'')+raw.trim();
    }
  }
  flush();
  return out;
}
async function loadNotices(){
  try{ const txt=await fetchText(NOTICE_FILE);
    if(txt && txt.trim()){ const arr=parseNoticeFile(txt);
      if(arr.length){ NOTICES.length=0; arr.forEach(n=>NOTICES.push(n)); renderNav(); if(activeKey==='notice') renderMain(); }
    }
  }catch(e){}
}

     <div class="ntc-empty" id="ntcEmpty" style="display:none">선택한 카테고리의 공지가 없습니다.</div>
   </div>
   <div class="ntc-modal" id="ntcModal" aria-hidden="true">
     <div class="ntc-modal-dim" data-close="1"></div>
     <div class="ntc-modal-card" role="dialog" aria-modal="true">
       <button class="ntc-modal-x" data-close="1" aria-label="닫기">✕</button>
       <div class="ntc-modal-body" id="ntcModalBody"></div>
     </div>
   </div>`;
  (function(){
    const modal=$('ntcModal'), mbody=$('ntcModalBody'); if(!modal) return;
    function openNtc(i){ const n=sorted[i]; if(!n) return;
      mbody.innerHTML='<div class="nm-top"><span class="ncat cat-'+n.cat+'">'+esc(n.cat)+'</span>'
        +(i===0?'<span class="nled-tag"><span class="led-dot"></span>최근 공지</span>':'')
        +(n.pin?'<span class="npin">📌 긴급</span>':'')
        +'<span class="nm-date">'+esc(n.date)+'</span></div>'
        +'<h3 class="nm-title">'+esc(n.title)+'</h3>'
        +'<div class="nm-body">'+esc(n.body)+'</div>';
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
    }
    function closeNtc(){ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }
    document.querySelectorAll('.notice-list .ntc').forEach(function(el){
      el.addEventListener('click',function(){ openNtc(parseInt(el.getAttribute('data-i'),10)); });
      el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openNtc(parseInt(el.getAttribute('data-i'),10)); } });
    });
    modal.querySelectorAll('[data-close]').forEach(function(x){ x.addEventListener('click',closeNtc); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeNtc(); });
  })();
  (function(){
    const wrap=$('ntcFilter'); if(!wrap) return;
    const list=$('noticeListFull'), empty=$('ntcEmpty');
    wrap.querySelectorAll('.nf-chip').forEach(function(chip){
      chip.addEventListener('click',function(){
        const c=chip.getAttribute('data-cat');
        wrap.querySelectorAll('.nf-chip').forEach(function(x){ x.classList.remove('active'); });
        chip.classList.add('active');
        let shown=0;
        list.querySelectorAll('.ntc').forEach(function(card){
          const ok=(c==='all')||(card.getAttribute('data-cat')===c);
          card.classList.toggle('hide',!ok); if(ok) shown++;
        });
        if(empty) empty.style.display = shown ? 'none' : 'block';
      });
    });
  })();
  const t=themed(); if(!hasChart()){ ['fCat','fMon'].forEach(id=>{const e=$(id);if(e)e.style.display='block';}); return; }
  const cm={}; NOTICES.forEach(n=>cm[n.cat]=(cm[n.cat]||0)+1); const ck=Object.keys(cm);
  const colr={'안전':'#D64545','총무':'#1B63D6','교육':'#2E9E5B','인사':'#8A5AD6','일반':'#5A5F6E'};
  charts.cat=new Chart($('cCat'),{type:'doughnut',data:{labels:ck,datasets:[{data:ck.map(k=>cm[k]),backgroundColor:ck.map(k=>colr[k]||'#888'),borderColor:'#fff',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{color:t.legend,font:{weight:'700',size:11},padding:12,usePointStyle:true}}}}});
  const mm={}; NOTICES.forEach(n=>{const k=n.date.slice(0,7); mm[k]=(mm[k]||0)+1;}); const mk=Object.keys(mm).sort();
  charts.mon=new Chart($('cMon'),{type:'bar',data:{labels:mk,datasets:[{data:mk.map(k=>mm[k]),backgroundColor:'#1428A0',borderRadius:6,maxBarThickness:40}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:t.grid},ticks:{color:t.tick,stepSize:1}},x:{grid:{display:false},ticks:{color:t.tick,font:{size:11}}}}}});
}

/* ===== 안전교육 ===== */
function renderEdu(){
  const sub=EDU_SUBS[eduSubIdx];
  $('content').innerHTML=`
   <div class="cat-head tone-edu"><div class="big">🎓</div>
     <div><h2>안전교육</h2><p>안전보건관리 · 안전보건교육 자료를 조회하고 교육 영상을 시청합니다</p></div>
     <div class="hscore"><b>${EDU_SUBS.length}</b><span>교육 항목</span></div></div>
   <div class="section-label"><span class="bar" style="background:var(--edu)"></span>안전교육 동영상 <span class="sub">— 영상을 눌러 바로 재생</span></div>
   <div id="eduVidTop"></div>
   <div class="section-label"><span class="bar"></span>교육 항목</div>
   <div class="sub-grid" id="eduGrid">
     ${EDU_SUBS.map((s,i)=>`<div class="sub-card ${i===eduSubIdx?'active':''}" data-idx="${i}">
        <div class="nm"><span class="num">${i+1}</span>${s}</div><div class="meta">자료 조회 · 첨부파일</div></div>`).join('')}
   </div>
   <div class="section-label"><span class="bar"></span>교육 자료 통계 <span class="sub">— 항목별 등록 자료 건수(GitHub)</span></div>
   <div class="card"><div class="chart-box" style="height:220px"><canvas id="cEdu"></canvas></div><div class="chart-fallback" id="fEdu">GitHub 연동 자료 건수</div></div>
   <div class="section-label"><span class="bar"></span>자료 · 영상 <span class="sub">— ${EDU_CAT} · ${sub}</span></div>
   <div id="vidZone"></div>
   <div class="files-panel" id="eduFiles"></div>`;
  $('eduGrid').querySelectorAll('.sub-card').forEach(el=>el.addEventListener('click',()=>{ eduSubIdx=parseInt(el.getAttribute('data-idx'),10); renderMain(); }));
  renderEduTopVideos();
  renderEduFiles(sub); hydrateVideos(sub); drawEduChart();
}
function renderEduTopVideos(){
  const zone=$('eduVidTop'); if(!zone) return;
  const items=parseVidList(EDU_VIDEOS.join('\n'));
  if(items.length){ renderVideos(zone,items); }
  else { zone.innerHTML='<div class="empty-note">등록된 교육 동영상이 없습니다. 코드 상단 <b>EDU_VIDEOS</b> 목록에 유튜브 링크를 추가하면 자동으로 표시됩니다.</div>'; }
}
function renderEduFiles(sub){
  const key=skey(EDU_CAT,sub); const loading=(SAFE_INDEX===null);
  const files=(SAFE_INDEX&&SAFE_INDEX[key])?SAFE_INDEX[key].slice().sort((a,b)=>a.file<b.file?1:-1):[];
  let cards= loading?'<div class="file-card"><div class="fi">⏳</div><div class="fn">불러오는 중…</div></div>'
    : (files.length? files.map(f=>{const m=fileMeta(f.file);return `<a class="file-card doc" href="${encodeURI(f.path)}" target="_blank" rel="noopener"><div class="fi">📄</div><div class="fn">${esc(m.title||f.file)}</div><div class="fs">${esc(m.date)}</div></a>`;}).join('')
      : '<div class="file-card"><div class="fi">🗂️</div><div class="fn">등록된 자료 없음</div><div class="fs">GitHub에 올리면 표시</div></div>');
  $('eduFiles').innerHTML=`
    <div class="fp-head"><h3>${sub}</h3><span class="tag">자료 ${loading?'…':files.length}건</span>
      <a class="upload-btn" href="${addUploadHref(sub)}" target="_blank" rel="noopener">＋ GitHub에 자료 올리기</a></div>
    <p class="fp-desc">이 항목의 파일을 GitHub <b>${eduPath(sub)}</b> 폴더에 올리면 자동으로 표시되고, 클릭하면 새 탭에서 열립니다.</p>
    <div class="file-grid">${cards}</div>
    <div class="empty-note">※ 이 화면은 <b>안전보건관리 대시보드의 안전보건교육 자료</b>와 같은 GitHub 폴더를 공유합니다. <b>교육일지</b> 항목에 <b>영상목록.txt</b>를 올리면 위에 재생목록·플레이어가 나타납니다.</div>`;
}
function drawEduChart(){
  const t=themed(); if(!hasChart()){ const e=$('fEdu'); if(e)e.style.display='block'; return; }
  const counts=EDU_SUBS.map(s=>{ const k=skey(EDU_CAT,s); return (SAFE_INDEX&&SAFE_INDEX[k])?SAFE_INDEX[k].length:0; });
  charts.edu=new Chart($('cEdu'),{type:'bar',data:{labels:EDU_SUBS,datasets:[{data:counts,backgroundColor:['#2E9E5B','#2478C8','#E0A32E','#8A5AD6'],borderRadius:6,maxBarThickness:44}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:t.grid},ticks:{color:t.tick,stepSize:1}},x:{grid:{display:false},ticks:{color:t.tick,font:{size:11}}}}}});
}
function vidKind(v){ if(v.id) return 'yt'; if(/\.(mp4|webm|ogg|mov|m4v)(\?|$)/i.test(v.url)) return 'file'; return 'link'; }
function playerHTML(v,ap){ if(v.id) return '<iframe id="vidFrame" src="https://www.youtube.com/embed/'+v.id+(ap?'?autoplay=1':'')+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  if(vidKind(v)==='file') return '<video id="vidFrame" src="'+encodeURI(v.url)+'" controls '+(ap?'autoplay':'')+'></video>';
  return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff">외부 링크 · <a style="color:#8fc2ff" href="'+encodeURI(v.url)+'" target="_blank" rel="noopener">열기 ↗</a></div>'; }
function parseVidList(txt){ return String(txt).split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&l[0]!=='#').map(l=>{ let title='',url=''; if(l.indexOf('|')>=0){const p=l.split('|');title=p[0].trim();url=p.slice(1).join('|').trim();}else url=l; const id=ytId(url); if(!title)title=id?('교육 영상 '+id):url; return {title,url,id}; }).filter(v=>v.url); }
function renderVideos(zone,items){ if(!items.length){ zone.innerHTML=''; return; }
  zone.innerHTML='<div class="vid-wrap"><div class="vid-head">📺 교육 영상 <span class="vid-cnt">'+items.length+'개</span></div><div class="vid-body"><div class="vid-player" id="vidPlayer">'+playerHTML(items[0],false)+'</div><ul class="vid-list">'
    +items.map((v,i)=>{var k=vidKind(v);return '<li class="vid-item '+(i===0?'active':'')+'" data-i="'+i+'"><span>▶</span><span class="vt">'+esc(v.title)+'</span><span class="vk">'+(k==='yt'?'YouTube':k==='file'?'동영상':'링크')+'</span></li>';}).join('')+'</ul></div></div>';
  zone.querySelectorAll('.vid-item').forEach(li=>li.addEventListener('click',()=>{ const i=parseInt(li.getAttribute('data-i'),10); $('vidPlayer').innerHTML=playerHTML(items[i],true); zone.querySelectorAll('.vid-item').forEach(x=>x.classList.remove('active')); li.classList.add('active'); })); }
async function hydrateVideos(sub){ const zone=$('vidZone'); if(!zone) return; const key=skey(EDU_CAT,sub);
  if(VID_INDEX===null){ zone.innerHTML=''; return; } const lists=VID_INDEX[key]||[]; if(!lists.length){ zone.innerHTML=''; return; }
  zone.innerHTML='<div style="font-size:0.78rem;color:var(--text-tertiary);padding:6px 2px">📺 교육 영상 불러오는 중…</div>';
  let items=[]; for(var i=0;i<lists.length;i++){ var tx=await fetchText(lists[i].path); if(tx) items=items.concat(parseVidList(tx)); } renderVideos(zone,items); }

/* ===== 셔틀버스 ===== */
function busTable(rows, kind){
  return `<div class="route ${kind}"><div class="rh">${kind==='up'?'🌅 출근':'🌆 퇴근'} <span class="plate"></span></div>
    <table><thead><tr><th>No</th><th>정류장</th><th>1회</th><th>2회</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr><td>${i+1}</td><td class="stop">${esc(r[0])}</td><td class="t">${esc(r[1])}</td><td class="t">${esc(r[2])}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function renderBus(){
  const totalRuns = BUS.routes.reduce((s,r)=>s+r.up.length+r.down.length,0);
  const stops = new Set(); BUS.routes.forEach(r=>{ r.up.forEach(x=>stops.add(x[0])); r.down.forEach(x=>stops.add(x[0])); });
  $('content').innerHTML=`
   <div class="cat-head tone-bus"><div class="big">🚌</div>
     <div><h2>셔틀버스 운행 안내</h2><p>${esc(BUS.title)}</p></div>
     <div class="hscore"><b>2</b><span>운행 노선</span></div></div>

   <div class="section-label"><span class="bar" style="background:var(--bus)"></span>연락처 · 요약</div>
   <div class="card-grid" style="grid-template-columns:1.1fr 1.4fr;">
     <div class="contact-card"><div class="ic">☎</div><div><div class="lb">셔틀버스 운행 문의</div><div class="num"><a href="tel:031-555-2962">031-555-2962</a></div></div></div>
     <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
       <div class="kpi"><div class="bar" style="background:var(--bus)"></div><div class="kl">🚌 운행 노선</div><div class="kv">2<small>개</small></div><div class="ks">도농 · 사릉</div></div>
       <div class="kpi"><div class="bar" style="background:#1B63D6"></div><div class="kl">📍 정류장</div><div class="kv">${stops.size}<small>곳</small></div><div class="ks">중복 제외</div></div>
       <div class="kpi"><div class="bar" style="background:#2E9E5B"></div><div class="kl">🕒 1일 운행</div><div class="kv">${totalRuns}<small>편</small></div><div class="ks">출·퇴근 합계</div></div>
     </div>
   </div>

   ${BUS.routes.map(r=>`
     <div class="section-label"><span class="bar" style="background:var(--bus)"></span>${esc(r.group)} <span class="sub">— 차량 ${esc(r.plate)}</span></div>
     <div class="route-grid">
       ${busTable(r.up,'up').replace('<span class="plate"></span>','<span class="plate">'+esc(r.plate)+'</span>')}
       ${busTable(r.down,'down').replace('<span class="plate"></span>','<span class="plate">'+esc(r.plate)+'</span>')}
     </div>`).join('')}

   <div class="section-label"><span class="bar" style="background:var(--bus)"></span>통근버스 사진</div>
   <div class="card"><img class="bus-photo" src="${BUS_IMG}" alt="삼화당피앤티 통근버스(HANA)"/>
     <p style="margin:12px 2px 0;font-size:0.74rem;color:var(--text-tertiary);font-weight:600">※ 노선·시간은 사정에 따라 변경될 수 있습니다. 변경 시 「사내 공지문」으로 안내됩니다. 문의 031-555-2962.</p></div>`;
}
function openBusPrint(){
  const routeBlock = r => `
    <div class="pr-grp"><div class="pr-gt">${r.group} <span>차량 ${r.plate}</span></div>
    <div class="pr-two">
      ${['up','down'].map(k=>`<table class="pr-tbl"><caption>${k==='up'?'출근':'퇴근'}</caption>
        <tr><th>No</th><th>정류장</th><th>1회</th><th>2회</th></tr>
        ${r[k].map((x,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}
      </table>`).join('')}
    </div></div>`;
  const html='<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>'+BUS.title+'</title>'
   +'<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">'
   +'<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{font-family:Pretendard,sans-serif;color:#12183a;padding:22px;background:#eef}'
   +'.page{width:210mm;margin:0 auto;background:#fff;padding:16mm 14mm;box-shadow:0 6px 24px rgba(0,0,0,.15)}'
   +'.rh{display:flex;align-items:center;gap:12px;border-bottom:3px solid #E8710A;padding-bottom:12px;margin-bottom:16px}'
   +'.rh .lo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#B8560A,#E8710A);color:#fff;display:grid;place-items:center;font-size:24px}'
   +'.rh h1{font-size:20px;font-weight:900}.rh .ct{margin-left:auto;font-weight:900;color:#B8560A;font-size:15px}'
   +'.pr-grp{margin-top:16px}.pr-gt{font-size:14px;font-weight:900;color:#0A1758;margin-bottom:8px}.pr-gt span{font-size:11px;font-weight:700;color:#6a7085;margin-left:8px}'
   +'.pr-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pr-tbl{width:100%;border-collapse:collapse;font-size:12px}'
   +'.pr-tbl caption{text-align:left;font-weight:800;padding:4px 0;color:#33384a}.pr-tbl th,.pr-tbl td{border:1px solid #d8dbe6;padding:6px 8px;text-align:center}.pr-tbl th{background:#f4f5f8}'
   +'.toolbar{max-width:210mm;margin:0 auto 12px;display:flex;gap:8px;justify-content:flex-end}.toolbar button{font-family:inherit;font-weight:800;font-size:13px;padding:10px 18px;border:0;border-radius:9999px;cursor:pointer}.toolbar .p{background:#E8710A;color:#fff}.toolbar .c{background:#e2e6ef;color:#33384a}'
   +'@media print{body{background:#fff;padding:0}.toolbar{display:none}.page{box-shadow:none;width:auto;padding:12mm}@page{size:A4;margin:0}}</style></head><body>'
   +'<div class="toolbar"><button class="p" onclick="window.print()">🖨️ 인쇄 / PDF</button><button class="c" onclick="window.close()">닫기</button></div>'
   +'<div class="page"><div class="rh"><div class="lo">🚌</div><div><h1>'+BUS.title+'</h1></div><div class="ct">☎ '+BUS.contact+'</div></div>'
   +BUS.routes.map(routeBlock).join('')
   +'<p style="margin-top:16px;font-size:11px;color:#6a7085">※ 노선·시간은 사정에 따라 변경될 수 있습니다. 변경 시 사내 공지로 안내됩니다.</p></div></body></html>';
  const w=window.open('','_blank'); if(!w){ alert('팝업이 차단되었습니다. 팝업 허용 후 다시 시도하세요.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ===== 공통 이벤트 ===== */
$('themeBtn').addEventListener('click',()=>{ const d=document.body.classList.toggle('dark'); $('themeBtn').firstChild.nodeValue=d?'☀️ ':'🌙 '; $('themeLabel').textContent=d?'라이트 모드':'다크 모드'; renderMain(); });
$('printBtn').addEventListener('click', openBusPrint);
(function(){ const d=new Date(); const wd=['일','월','화','수','목','금','토'][d.getDay()]; $('today').textContent=d.getFullYear()+'. '+String(d.getMonth()+1).padStart(2,'0')+'. '+String(d.getDate()).padStart(2,'0')+'. ('+wd+')'; })();

renderNav();
renderMain();
loadSafeIndex();
loadNotices();
loadEduVideos();
</script>
